<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Successful</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .success-box {
      background: white;
      width: 420px;
      padding: 40px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    .check {
      font-size: 65px;
      margin-bottom: 10px;
    }

    h1 {
      color: #198754;
    }

    p {
      font-size: 17px;
      color: #555;
    }

    button {
      margin-top: 20px;
      padding: 13px 25px;
      border: none;
      border-radius: 7px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <div class="success-box">

    <div class="check">✅</div>

    <h1>Order Successful!</h1>

    <p>Thank you for your order.</p>
    <p>Your order has been placed successfully.</p>

    <button onclick="window.location.href='products.html'">
      Continue Shopping
    </button>

  </div>

</body>
</html>
