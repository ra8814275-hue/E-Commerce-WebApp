<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 40px;
    }

    .checkout-box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 25px;
      border: none;
      border-radius: 6px;
      background: #198754;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #146c43;
    }
  </style>
</head>

<body>

  <div class="checkout-box">

    <h1>Checkout</h1>

    <form id="checkoutForm">

      <label>Full Name</label>
      <input type="text" id="name" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Phone Number</label>
      <input type="tel" id="phone" required>

      <label>Delivery Address</label>
      <textarea id="address" rows="4" required></textarea>

      <button type="submit">
        Place Order
      </button>

    </form>

  </div>

  <script>
    document
      .getElementById("checkoutForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        localStorage.removeItem("cart");

        window.location.href = "success.html";
      });
  </script>

</body>
</html>
