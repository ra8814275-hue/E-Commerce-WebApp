<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Products</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
    }

    /* Navbar */
    .navbar {
      background: #212529;
      color: white;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 16px;
    }

    .nav-links a:hover {
      color: #0d6efd;
    }

    .logout-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .logout-btn:hover {
      background: #bb2d3b;
    }

    .main-content {
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    #products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .product-card {
      background: white;
      width: 280px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .product-card h2 {
      margin-top: 0;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: #198754;
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .add-btn:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <nav class="navbar">

    <div class="logo">
      🛍️ E-Commerce Store
    </div>

    <div class="nav-links">

      <a href="products.html">
        Products
      </a>

      <a href="cart.html">
        🛒 Cart
      </a>

      <button class="logout-btn" onclick="logout()">
        Logout
      </button>

    </div>

  </nav>

  <div class="main-content">

    <h1>Our Products</h1>

    <div id="products"></div>

  </div>

  <script>

    async function loadProducts() {
      try {

        const response = await fetch(
          "http://localhost:5000/api/products"
        );

        const products = await response.json();

        const container = document.getElementById("products");

        container.innerHTML = "";

        products.forEach(product => {

          const card = document.createElement("div");

          card.className = "product-card";

          card.innerHTML = `
            <h2>${product.name}</h2>

            <p class="price">
              ₹${product.price}
            </p>

            <p>${product.description}</p>

            <p>
              <b>Category:</b>
              ${product.category}
            </p>

            <p>
              <b>Stock:</b>
              ${product.stock}
            </p>

            <button
              class="add-btn"
              onclick='addToCart(${JSON.stringify(product)})'>
              Add to Cart
            </button>
          `;

          container.appendChild(card);

        });

      } catch (error) {

        document.getElementById("products").innerHTML =
          "<p>Unable to load products.</p>";

      }
    }


    function addToCart(product) {

      let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

      cart.push(product);

      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );

      alert("Product Added to Cart!");

      window.location.href = "cart.html";
    }


    function logout() {

      localStorage.removeItem("token");

      window.location.href = "login.html";
    }


    loadProducts();

  </script>

</body>
</html>
