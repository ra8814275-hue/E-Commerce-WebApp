<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px;
    }

    h1 {
      text-align: center;
    }

    #cartItems {
      max-width: 700px;
      margin: 30px auto;
    }

    .cart-item {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .price {
      color: green;
      font-weight: bold;
      font-size: 20px;
    }

    .remove-btn {
      background: red;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    #total {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    #checkoutBtn {
      display: block;
      width: 250px;
      margin: 25px auto;
      padding: 14px;
      background: #198754;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      cursor: pointer;
    }

    #checkoutBtn:hover {
      background: #146c43;
    }
  </style>
</head>

<body>

  <h1>🛒 My Cart</h1>

  <div id="cartItems"></div>

  <div id="total"></div>

  <button id="checkoutBtn" onclick="goToCheckout()">
    Proceed to Checkout
  </button>

  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const cartItems = document.getElementById("cartItems");
    const totalElement = document.getElementById("total");
    const checkoutBtn = document.getElementById("checkoutBtn");

    function displayCart() {
      cartItems.innerHTML = "";

      if (cart.length === 0) {
        cartItems.innerHTML = "<h2>Your Cart is Empty</h2>";
        totalElement.innerHTML = "";
        checkoutBtn.style.display = "none";
        return;
      }

      checkoutBtn.style.display = "block";

      let total = 0;

      cart.forEach((product, index) => {
        total += Number(product.price);

        cartItems.innerHTML += `
          <div class="cart-item">
            <h2>${product.name}</h2>
            <p>${product.description || ""}</p>
            <p class="price">₹${product.price}</p>

            <button class="remove-btn" onclick="removeItem(${index})">
              Remove
            </button>
          </div>
        `;
      });

      totalElement.innerHTML = `Total: ₹${total}`;
    }

    function removeItem(index) {
      cart.splice(index, 1);

      localStorage.setItem("cart", JSON.stringify(cart));

      displayCart();
    }

    function goToCheckout() {
      window.location.href = "checkout.html";
    }

    displayCart();
  </script>

</body>
</html>
